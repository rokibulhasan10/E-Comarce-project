<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopNest | Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Shop<span>Nest</span></a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        <li class="nav-item ms-lg-2"><button class="btn btn-dark" onclick="showCart()">Cart (<span id="cartCount">0</span>)</button></li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-title"><div class="container"><h1>Products</h1><p>Home / Products</p></div></div>

<section class="py-5">
  <div class="container">
    <div class="row">
      <aside class="col-lg-3 mb-4">
        <div class="filter-box">
          <h5>Categories</h5>
          <button class="filter-btn active" onclick="filterProducts('all', this)">All Products</button>
          <button class="filter-btn" onclick="filterProducts('fashion', this)">Fashion</button>
          <button class="filter-btn" onclick="filterProducts('electronics', this)">Electronics</button>
          <button class="filter-btn" onclick="filterProducts('accessories', this)">Accessories</button>
          <button class="filter-btn" onclick="filterProducts('home', this)">Home</button>
        </div>
      </aside>
      <main class="col-lg-9">
        <div class="row g-4" id="productGrid"></div>
      </main>
    </div>
  </div>
</section>

<footer class="footer"><div class="container py-4 text-center"><h5>ShopNest</h5><small>© 2026 ShopNest</small></div></footer>
<div class="modal fade" id="cartModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content">
  <div class="modal-header"><h5>Your Cart</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="cartItems"></div>
  <div class="modal-footer"><strong>Total: $<span id="cartTotal">0.00</span></strong></div>
</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
<script>loadProducts("productGrid");</script>
</body>
</html>
